name: Build and Integration Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # Runs directly on the Ubuntu runner rather than inside a job container so
    # that Testcontainers can reach the runner's Docker daemon.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run unit and integration tests
        run: mvn --batch-mode --no-transfer-progress -Pintegration-tests verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: ignore
